name: Funding Rate Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: funding-rate-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scan funding rates
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python monitor.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Alert state unchanged."
          else
            git commit -m "Update funding alert state"
            git push origin HEAD:main
          fi
